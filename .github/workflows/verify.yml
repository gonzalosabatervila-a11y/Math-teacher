name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for likely secrets
        run: |
          secret_pattern='sk-''proj-|AI''za[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE'' KEY'
          if git grep -nE "$secret_pattern" -- ':(exclude)package-lock.json'; then
            exit 1
          fi
